<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <style>
      text { font-family: "Source Sans Pro", Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#1b2a32"/>

  <!-- Left sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#18262e"/>
  <!-- Sidebar top logo area -->
  <rect x="0" y="0" width="220" height="56" fill="#0f1f27"/>
  <text x="30" y="35" fill="#ffffff" font-size="18" font-weight="700">🐄 Rancher</text>

  <!-- Sidebar nav items -->
  <rect x="0" y="56" width="220" height="1" fill="#2e4c5c"/>
  <!-- Products label -->
  <text x="18" y="90" fill="#8fa8b4" font-size="11" font-weight="600" letter-spacing="1">CATTLE DRIVE</text>
  <!-- Active: Dashboard -->
  <rect x="0" y="97" width="220" height="36" fill="#0d6e8e" opacity="0.4"/>
  <rect x="0" y="97" width="3" height="36" fill="#2cb1e0"/>
  <text x="26" y="119" fill="#ffffff" font-size="13">📋 Dashboard</text>
  <!-- Status -->
  <text x="26" y="155" fill="#8fa8b4" font-size="13">🔍 Migration Status</text>
  <!-- Migrate -->
  <text x="26" y="191" fill="#8fa8b4" font-size="13">🚀 Run Migration</text>

  <!-- Main content area -->
  <rect x="220" y="0" width="1060" height="800" fill="#1e3342"/>

  <!-- Top bar -->
  <rect x="220" y="0" width="1060" height="52" fill="#152533"/>
  <text x="240" y="32" fill="#8fa8b4" font-size="13">Home / Cattle Drive / Dashboard</text>

  <!-- Page content -->
  <!-- Header -->
  <line x1="240" y1="110" x2="1240" y2="110" stroke="#2e4c5c" stroke-width="1"/>
  <text x="240" y="90" fill="#ffffff" font-size="22" font-weight="600">⬡ Cattle Drive</text>
  <text x="240" y="130" fill="#8fa8b4" font-size="14">
    Migrate Rancher objects — Projects, Namespaces, Role Bindings, and Catalog Repos
  </text>
  <text x="240" y="148" fill="#8fa8b4" font-size="14">from one downstream cluster to another.</text>

  <!-- Cluster Picker Card -->
  <rect x="240" y="170" width="980" height="180" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="264" y="198" fill="#8fa8b4" font-size="11" font-weight="600" letter-spacing="1">SELECT CLUSTERS</text>

  <!-- Source cluster dropdown -->
  <rect x="264" y="208" width="380" height="62" rx="4" fill="#1b3045" stroke="#2e4c5c" stroke-width="1"/>
  <text x="278" y="226" fill="#8fa8b4" font-size="11">Source Cluster</text>
  <text x="278" y="248" fill="#ffffff" font-size="14">hussein-rke1</text>
  <text x="614" y="248" fill="#2cb1e0" font-size="18">▾</text>

  <!-- Arrow -->
  <text x="664" y="248" fill="#2cb1e0" font-size="24" font-weight="300">→</text>

  <!-- Target cluster dropdown -->
  <rect x="700" y="208" width="380" height="62" rx="4" fill="#1b3045" stroke="#2e4c5c" stroke-width="1"/>
  <text x="714" y="226" fill="#8fa8b4" font-size="11">Target Cluster</text>
  <text x="714" y="248" fill="#ffffff" font-size="14">hgalal-rke2</text>
  <text x="1050" y="248" fill="#2cb1e0" font-size="18">▾</text>

  <!-- Action buttons -->
  <rect x="800" y="296" width="190" height="36" rx="4" fill="none" stroke="#2cb1e0" stroke-width="1.5"/>
  <text x="825" y="319" fill="#2cb1e0" font-size="13">☰ View Migration Status</text>
  <rect x="1006" y="296" width="170" height="36" rx="4" fill="#0d6e8e"/>
  <text x="1038" y="319" fill="#ffffff" font-size="13">↑ Run Migration</text>

  <!-- Feature cards -->
  <!-- Card 1 -->
  <rect x="240" y="380" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="264" y="410" fill="#2cb1e0" font-size="22">📁</text>
  <text x="264" y="435" fill="#ffffff" font-size="13" font-weight="600">Projects &amp; Namespaces</text>
  <text x="264" y="455" fill="#8fa8b4" font-size="12">Migrate custom projects and</text>
  <text x="264" y="471" fill="#8fa8b4" font-size="12">namespaces with resource quotas.</text>

  <!-- Card 2 -->
  <rect x="490" y="380" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="514" y="410" fill="#2cb1e0" font-size="22">👤</text>
  <text x="514" y="435" fill="#ffffff" font-size="13" font-weight="600">Role Bindings</text>
  <text x="514" y="455" fill="#8fa8b4" font-size="12">Migrate PRTBs and CRTBs</text>
  <text x="514" y="471" fill="#8fa8b4" font-size="12">to maintain user permissions.</text>

  <!-- Card 3 -->
  <rect x="740" y="380" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="764" y="410" fill="#2cb1e0" font-size="22">📦</text>
  <text x="764" y="435" fill="#ffffff" font-size="13" font-weight="600">Catalog Repos</text>
  <text x="764" y="455" fill="#8fa8b4" font-size="12">Migrate custom Helm catalog</text>
  <text x="764" y="471" fill="#8fa8b4" font-size="12">repositories to the target cluster.</text>

  <!-- Card 4 -->
  <rect x="990" y="380" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="1014" y="410" fill="#2cb1e0" font-size="22">🔎</text>
  <text x="1014" y="435" fill="#ffffff" font-size="13" font-weight="600">Drift Detection</text>
  <text x="1014" y="455" fill="#8fa8b4" font-size="12">Identify objects that exist but</text>
  <text x="1014" y="471" fill="#8fa8b4" font-size="12">have diverged from source spec.</text>
</svg>
