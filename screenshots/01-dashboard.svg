<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880">
  <defs>
    <style>text { font-family: "Source Sans Pro", Arial, sans-serif; }</style>
  </defs>
  <!-- Background -->
  <rect width="1280" height="880" fill="#1b2a32"/>
  <!-- Left sidebar -->
  <rect x="0" y="0" width="220" height="880" fill="#18262e"/>
  <rect x="0" y="0" width="220" height="56" fill="#0f1f27"/>
  <text x="30" y="35" fill="#ffffff" font-size="18" font-weight="700">🐄 Rancher</text>
  <rect x="0" y="56" width="220" height="1" fill="#2e4c5c"/>
  <text x="18" y="90" fill="#8fa8b4" font-size="11" font-weight="600" letter-spacing="1">CATTLE DRIVE</text>
  <!-- Active: Dashboard -->
  <rect x="0" y="97" width="220" height="36" fill="#0d6e8e" opacity="0.4"/>
  <rect x="0" y="97" width="3" height="36" fill="#2cb1e0"/>
  <text x="26" y="119" fill="#ffffff" font-size="13">📋 Dashboard</text>
  <text x="26" y="155" fill="#8fa8b4" font-size="13">🔍 Migration Status</text>
  <text x="26" y="191" fill="#8fa8b4" font-size="13">🚀 Run Migration</text>
  <!-- Main content -->
  <rect x="220" y="0" width="1060" height="880" fill="#1e3342"/>
  <rect x="220" y="0" width="1060" height="52" fill="#152533"/>
  <text x="240" y="32" fill="#8fa8b4" font-size="13">Home / Cattle Drive / Dashboard</text>
  <!-- Title -->
  <line x1="240" y1="110" x2="1240" y2="110" stroke="#2e4c5c" stroke-width="1"/>
  <text x="240" y="90" fill="#ffffff" font-size="22" font-weight="600">⬡ Cattle Drive</text>
  <text x="240" y="130" fill="#8fa8b4" font-size="14">Migrate Rancher objects — Projects, Namespaces, Role Bindings, and Catalog Repos</text>
  <text x="240" y="148" fill="#8fa8b4" font-size="14">from one downstream cluster to another.</text>
  <!-- Connection Settings Card -->
  <rect x="240" y="168" width="980" height="116" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="264" y="194" fill="#8fa8b4" font-size="11" font-weight="600" letter-spacing="1">CONNECTION SETTINGS</text>
  <!-- API URL field -->
  <rect x="264" y="204" width="380" height="52" rx="4" fill="#1b3045" stroke="#2e4c5c" stroke-width="1"/>
  <text x="278" y="222" fill="#8fa8b4" font-size="11">cattle-drive API Server URL</text>
  <text x="278" y="242" fill="#ffffff" font-size="13">http://localhost:8080</text>
  <!-- Kubeconfig field -->
  <rect x="660" y="204" width="380" height="52" rx="4" fill="#1b3045" stroke="#2e4c5c" stroke-width="1"/>
  <text x="674" y="222" fill="#8fa8b4" font-size="11">Kubeconfig Path (server-side)</text>
  <text x="674" y="242" fill="#ffffff" font-size="13">/etc/rancher/kubeconfig.yaml</text>
  <!-- Load clusters button -->
  <rect x="1056" y="210" width="140" height="36" rx="4" fill="none" stroke="#2cb1e0" stroke-width="1.5"/>
  <text x="1074" y="232" fill="#2cb1e0" font-size="13">⟳ Load Clusters</text>
  <!-- Cluster Picker Card -->
  <rect x="240" y="302" width="980" height="172" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="264" y="328" fill="#8fa8b4" font-size="11" font-weight="600" letter-spacing="1">SELECT CLUSTERS</text>
  <!-- Source dropdown -->
  <rect x="264" y="338" width="380" height="52" rx="4" fill="#1b3045" stroke="#2e4c5c" stroke-width="1"/>
  <text x="278" y="356" fill="#8fa8b4" font-size="11">Source Cluster</text>
  <text x="278" y="376" fill="#ffffff" font-size="14">hussein-rke1</text>
  <text x="614" y="376" fill="#2cb1e0" font-size="18">▾</text>
  <text x="658" y="376" fill="#2cb1e0" font-size="22">→</text>
  <!-- Target dropdown -->
  <rect x="700" y="338" width="380" height="52" rx="4" fill="#1b3045" stroke="#2e4c5c" stroke-width="1"/>
  <text x="714" y="356" fill="#8fa8b4" font-size="11">Target Cluster</text>
  <text x="714" y="376" fill="#ffffff" font-size="14">hgalal-rke2</text>
  <text x="1050" y="376" fill="#2cb1e0" font-size="18">▾</text>
  <!-- Action buttons -->
  <rect x="804" y="416" width="186" height="36" rx="4" fill="none" stroke="#2cb1e0" stroke-width="1.5"/>
  <text x="820" y="439" fill="#2cb1e0" font-size="13">☰ View Migration Status</text>
  <rect x="1006" y="416" width="170" height="36" rx="4" fill="#0d6e8e"/>
  <text x="1038" y="439" fill="#ffffff" font-size="13">↑ Run Migration</text>
  <!-- Feature cards -->
  <rect x="240" y="502" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="264" y="532" fill="#2cb1e0" font-size="22">📁</text>
  <text x="264" y="556" fill="#ffffff" font-size="13" font-weight="600">Projects &amp; Namespaces</text>
  <text x="264" y="576" fill="#8fa8b4" font-size="12">Migrate custom projects and</text>
  <text x="264" y="592" fill="#8fa8b4" font-size="12">their namespaces.</text>
  <rect x="490" y="502" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="514" y="532" fill="#2cb1e0" font-size="22">👤</text>
  <text x="514" y="556" fill="#ffffff" font-size="13" font-weight="600">Role Bindings</text>
  <text x="514" y="576" fill="#8fa8b4" font-size="12">Migrate PRTBs and CRTBs</text>
  <text x="514" y="592" fill="#8fa8b4" font-size="12">to maintain user permissions.</text>
  <rect x="740" y="502" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="764" y="532" fill="#2cb1e0" font-size="22">📦</text>
  <text x="764" y="556" fill="#ffffff" font-size="13" font-weight="600">Catalog Repos</text>
  <text x="764" y="576" fill="#8fa8b4" font-size="12">Migrate custom Helm catalog</text>
  <text x="764" y="592" fill="#8fa8b4" font-size="12">repositories.</text>
  <rect x="990" y="502" width="230" height="120" rx="6" fill="#162838" stroke="#2e4c5c" stroke-width="1"/>
  <text x="1014" y="532" fill="#2cb1e0" font-size="22">��</text>
  <text x="1014" y="556" fill="#ffffff" font-size="13" font-weight="600">Drift Detection</text>
  <text x="1014" y="576" fill="#8fa8b4" font-size="12">Identify objects that have</text>
  <text x="1014" y="592" fill="#8fa8b4" font-size="12">diverged from source spec.</text>
</svg>
