name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  typecheck-extension:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-extension/package.json
      - name: Install dependencies
        run: npm install
      - name: TypeScript type-check
        run: npm run type-check

  release-tag:
    runs-on: ubuntu-22.04
    needs: typecheck-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          cache: false
          go-version: "1.22"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: v1.23.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}